apiVersion: 1
datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: {{ .Values.influxdb.org }}
      defaultBucket: {{ .Values.influxdb.bucket }}
    secureJsonData:
      # Expanded by Grafana from the container environment.
      token: $INFLUXDB_READ_TOKEN
